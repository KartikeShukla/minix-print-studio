appId: org.minix.printstudio
productName: MiniX Print Studio
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: ../../dist/release
  buildResources: build

files:
  - out/**
  - package.json
  - "!**/*.map"
  - "!**/.env"
  - "!**/.env.*"
  - "!runtime/**"
  - "!logs/**"
  - "!diagnostics/**"
  - "!previews/**"
  - "!jobs/**"
  - "!hardware-artifacts/**"

extraResources:
  - from: ../../dist/sidecars
    to: sidecars
    filter:
      - minixd*
      - minix-mcp*

extraMetadata:
  main: out/main/index.js

mac:
  icon: build/icon.png
  target:
    - target: dir
      arch:
        - arm64
        - x64
  category: public.app-category.utilities
  extendInfo:
    NSBluetoothAlwaysUsageDescription: MiniX Print Studio uses Bluetooth only to connect to your local MiniX thermal printer.
    NSBluetoothPeripheralUsageDescription: MiniX Print Studio uses Bluetooth only to connect to your local MiniX thermal printer.
  identity: null

win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - target: dir
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish: null
