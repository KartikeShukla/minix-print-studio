[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "minixd"
version = "0.1.0"
description = "Local daemon for MiniX Print Studio."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "bleak>=0.22.0,<4",
  "fastapi>=0.115.0",
  "pillow>=11.0.0",
  "pydantic>=2.10.0",
  "qrcode[pil]>=8.0.0,<9",
  "uvicorn>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "ruff>=0.9.0"
]

[project.scripts]
minixd = "minixd.__main__:main"
minix-hardware-test = "minixd.hardware_test_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minixd"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["minixd"]
