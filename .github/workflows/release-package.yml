name: Release Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-package.yml"
      - "apps/desktop/**"
      - "daemon/**"
      - "mcp/**"
      - "profiles/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-package.yml"
      - "apps/desktop/**"
      - "daemon/**"
      - "mcp/**"
      - "profiles/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS unsigned package
            os: macos-latest
            package_command: pnpm package:mac
            artifact_name: minix-print-studio-macos-unsigned
          - name: Windows unsigned package
            os: windows-latest
            package_command: pnpm package:win
            artifact_name: minix-print-studio-windows-unsigned
          - name: Windows unsigned installer
            os: windows-latest
            package_command: pnpm package:win-installer
            artifact_name: minix-print-studio-windows-installer-unsigned

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e daemon[dev] -e mcp[dev]
      - run: pnpm release-package-check
      - run: ${{ matrix.package_command }}
      - run: node scripts/run_python.mjs scripts/validate_packaged_app_smoke.py dist/release
      - run: node scripts/run_python.mjs scripts/write_release_checksums.py dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/release
            !dist/release/builder-debug.yml
            !dist/release/.icon-*
          retention-days: 7
